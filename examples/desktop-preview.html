<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@smpl2 — desktop preview</title>
<style>
  :root {
    --paper: #f2f1ec;
    --paper-2: #e7e6df;
    --card: #f8f7f3;
    --ink: #17191a;
    --muted: #6f716d;
    --line: rgba(0, 0, 0, .08);
    --accent: #1e6b4d;
    --accent-soft: rgba(30, 107, 77, .12);
    --danger: #b3412e;
    --warn: #9a7a16;
    --r: 16px;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121413;
      --paper-2: #1c1f1d;
      --card: #171a18;
      --ink: #eceee9;
      --muted: #8b8f89;
      --line: rgba(255, 255, 255, .08);
      --accent: #4fbf8c;
      --accent-soft: rgba(79, 191, 140, .14);
      --danger: #e0715b;
      --warn: #d8b24a;
    }
  }
  :root[data-theme="dark"] {
    --paper: #121413; --paper-2: #1c1f1d; --card: #171a18; --ink: #eceee9; --muted: #8b8f89;
    --line: rgba(255, 255, 255, .08); --accent: #4fbf8c; --accent-soft: rgba(79, 191, 140, .14);
    --danger: #e0715b; --warn: #d8b24a;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--paper); color: var(--ink); overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  /* ---------- каркас: карта слева, категория справа ---------- */
  .app { display: flex; height: 100vh; }
  .map-wrap { position: relative; flex: 1 1 auto; min-width: 0; min-height: 0; overflow: hidden; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #map.is-drag { cursor: grabbing; }

  .brand {
    position: absolute; top: 20px; left: 0; right: 0; margin: 0; text-align: center; pointer-events: none;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; letter-spacing: .34em;
    color: var(--muted); text-transform: lowercase;
  }
  .status {
    position: absolute; top: 14px; right: 18px; display: flex; align-items: center; gap: 8px;
    padding: 7px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line);
    font-size: 13px; color: var(--muted); transition: color .3s;
  }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transition: background .3s, box-shadow .3s; }
  .status.on { color: var(--ink); }
  .status.on i { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }

  .connect-wrap {
    position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .connect {
    position: relative; width: 300px; height: 60px; border: 0; border-radius: 999px;
    background: var(--ink); color: var(--paper); cursor: pointer; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none;
    font-weight: 600; font-size: 15px;
    box-shadow: 0 14px 30px -18px rgba(0, 0, 0, .5);
    transition: background .3s ease, transform .15s ease;
  }
  .connect::before {
    content: ""; position: absolute; inset: 0; background: var(--accent);
    transform: scaleX(var(--p, 0)); transform-origin: left center;
  }
  .connect span { position: relative; }
  .connect:active { transform: scale(.985); }
  .connect.on { background: var(--accent); }
  .connect.on::before { display: none; }
  .hint { font-size: 12px; color: var(--muted); }

  /* нижняя панель: только категории, карты среди них нет */
  .dock {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 4;
    display: flex; gap: 4px; padding: 5px; border-radius: 999px;
    background: color-mix(in srgb, var(--card) 88%, transparent);
    border: 1px solid var(--line);
    box-shadow: 0 12px 28px -18px rgba(0, 0, 0, .45);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
  .dock-mark {
    position: absolute; top: 5px; bottom: 5px; left: 0; width: 0; border-radius: 999px;
    background: var(--accent-soft); opacity: 0;
    transition: left .5s var(--ease), width .5s var(--ease), opacity .3s;
  }
  .dock.has-active .dock-mark { opacity: 1; }
  .tab {
    position: relative; z-index: 1; height: 46px; padding: 0 18px; border: 0; border-radius: 999px;
    background: transparent; color: var(--muted); cursor: pointer;
    display: flex; align-items: center; gap: 8px; font-size: 14px; white-space: nowrap;
    transition: color .3s;
  }
  .tab svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
  .tab:hover { color: var(--ink); }
  .tab.is-active { color: var(--accent); }

  .toast {
    position: absolute; left: 50%; bottom: 160px; transform: translate(-50%, 12px); opacity: 0;
    padding: 9px 16px; border-radius: 999px; background: var(--ink); color: var(--paper);
    font-size: 13px; pointer-events: none; transition: opacity .25s, transform .25s; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- правая панель: выезжает из-за карты ---------- */
  .panel {
    flex: 0 0 0; width: 440px; overflow: hidden; visibility: hidden;
    border-left: 1px solid var(--line); background: var(--paper);
    transition: flex-basis .5s var(--ease), visibility 0s .5s;
  }
  .panel.is-open {
    flex-basis: 440px; visibility: visible;
    transition: flex-basis .5s var(--ease), visibility 0s;
  }
  .panel-inner {
    width: 440px; height: 100%; display: flex; flex-direction: column;
    opacity: 0; transform: translateX(36px);
    transition: opacity .3s ease, transform .5s var(--ease);
  }
  .panel.is-open .panel-inner { opacity: 1; transform: none; transition-delay: .12s, .12s; }
  .panel-inner.is-swap, .panel.is-open .panel-inner.is-swap { opacity: 0; transform: translateX(14px); transition: opacity .16s ease, transform .16s ease; }

  .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 12px; }
  .panel-head h2 { margin: 0; font-size: 19px; font-weight: 600; }
  .icon-btn {
    width: 34px; height: 34px; border: 0; border-radius: 11px; background: transparent; color: var(--muted);
    display: grid; place-items: center; cursor: pointer; flex: 0 0 auto;
  }
  .icon-btn:hover { background: var(--paper-2); color: var(--ink); }
  .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .panel-body { flex: 1; overflow: auto; padding: 0 18px 24px; }

  .search {
    width: 100%; height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); outline: none; margin-bottom: 14px;
  }
  .search:focus { border-color: var(--accent); }

  /* группы серверов и подписок */
  .group { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 12px; overflow: hidden; }
  .group-head { display: flex; align-items: center; gap: 8px; padding: 13px 10px 13px 16px; cursor: pointer; }
  .group-name { flex: 1; min-width: 0; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .count {
    min-width: 26px; height: 22px; padding: 0 7px; border-radius: 999px; background: var(--paper-2);
    display: inline-grid; place-items: center; font-size: 12px; color: var(--muted);
  }
  .chev { transition: transform .3s var(--ease); }
  .group.is-closed .chev { transform: rotate(-90deg); }
  .collapse { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .35s var(--ease); }
  .group.is-closed .collapse { grid-template-rows: 0fr; }
  .collapse > div { overflow: hidden; min-height: 0; }

  .group-desc { margin: 0 16px; padding: 0 0 10px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.5; color: var(--muted); }
  .stats {
    display: flex; align-items: center; gap: 10px; margin: 0 16px; padding: 9px 0 10px;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    font-family: ui-monospace, Menlo, monospace; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .bar { flex: 1; height: 4px; border-radius: 999px; background: var(--paper-2); overflow: hidden; min-width: 40px; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .5s var(--ease); }
  .group-actions { display: flex; gap: 8px; padding: 12px 16px 14px; }
  .ghost {
    height: 32px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: transparent;
    cursor: pointer; font-size: 13px; color: var(--muted);
  }
  .ghost:hover { color: var(--ink); background: var(--paper-2); }

  /* превью-карточки серверов */
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 12px 14px; }
  .card {
    position: relative; border: 1px solid var(--line); border-radius: 14px; background: var(--paper);
    padding: 0; overflow: hidden; cursor: pointer; text-align: left;
    transition: border-color .25s, box-shadow .25s, transform .25s var(--ease);
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 10px 22px -16px rgba(0, 0, 0, .45); }
  .card.is-sel { border: 2px solid var(--accent); }
  .card.is-hidden { opacity: .45; }
  .thumb {
    position: relative; height: 96px; overflow: hidden;
    background:
      radial-gradient(circle, color-mix(in srgb, var(--muted) 55%, transparent) .9px, transparent 1.2px) 0 0 / 6px 6px,
      linear-gradient(160deg, var(--paper-2), var(--card));
  }
  .thumb svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .thumb .arc { fill: none; stroke: var(--accent); stroke-width: 1.4; stroke-linecap: round; stroke-dasharray: 200; stroke-dashoffset: 200; transition: stroke-dashoffset .9s var(--ease); }
  .card.is-sel .thumb .arc, .card:hover .thumb .arc { stroke-dashoffset: 0; }
  .thumb .pin { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; }
  .thumb .pin.o { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .thumb .pin.s { background: var(--ink); }
  .card-body { padding: 9px 11px 11px; }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 4px; }
  .flag { font-size: 16px; line-height: 1; }
  .ping { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .ping.good { color: var(--accent); }
  .ping.mid { color: var(--warn); }
  .ping.bad { color: var(--danger); }
  .card .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .chip {
    font-family: ui-monospace, Menlo, monospace; font-size: 11px; padding: 3px 8px; border-radius: 999px;
    background: var(--paper-2); color: var(--muted); white-space: nowrap;
  }
  .sub-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 16px 6px; margin-bottom: 12px; }
  .sub-card h3 { margin: 0 0 6px; font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .sub-card p { margin: 0; font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.5; color: var(--muted); }
  .add-btn {
    width: 100%; height: 46px; border-radius: 14px; border: 1px dashed var(--line); background: transparent;
    cursor: pointer; color: var(--muted); font-size: 14px;
  }
  .add-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* статистика */
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .kpi b { display: block; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 12px; color: var(--muted); }
  .chart { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
  .chart h3 { margin: 0 0 14px; font-size: 14px; font-weight: 600; }
  .bars { display: flex; align-items: flex-end; gap: 10px; height: 150px; }
  .bars div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
  .bars i { display: block; width: 100%; border-radius: 8px 8px 4px 4px; background: var(--accent); height: 0; transition: height .7s var(--ease); }
  .bars span { margin-top: 6px; text-align: center; font-size: 11px; color: var(--muted); }

  /* настройки: разделы сворачиваются */
  .set { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 12px; overflow: hidden; }
  .set-head { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border: 0; background: transparent; cursor: pointer; font-weight: 600; font-size: 15px; text-align: left; }
  .set-body { padding: 0 16px 14px; }
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; font-size: 14px; }
  .set-row small { display: block; color: var(--muted); font-size: 12px; }
  .segmented { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--paper-2); }
  .segmented button {
    height: 30px; padding: 0 11px; border: 0; border-radius: 9px; background: transparent; color: var(--muted);
    cursor: pointer; font-size: 13px; white-space: nowrap; transition: background .25s, color .25s;
  }
  .segmented button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 2px 6px -3px rgba(0, 0, 0, .35); }

  /* узкие экраны: панель поверх карты */
  @media (max-width: 820px) {
    .panel { position: absolute; top: 0; right: 0; bottom: 0; flex: none; width: 0; z-index: 6; box-shadow: -18px 0 36px -26px rgba(0, 0, 0, .5); transition: width .5s var(--ease), visibility 0s .5s; }
    .panel.is-open { width: min(440px, 94vw); flex-basis: auto; transition: width .5s var(--ease), visibility 0s; }
    .panel-inner { width: min(440px, 94vw); }
    .dock .tab span.label { display: none; }
    .tab { padding: 0 14px; }
  }
</style>
</head>
<body>
<div class="app">

  <section class="map-wrap" id="mapWrap">
    <canvas id="map" aria-label="Карта серверов"></canvas>
    <p class="brand">@smpl2</p>
    <div class="status" id="status"><i></i><span>Не подключено</span></div>

    <div class="connect-wrap">
      <button class="connect" id="connect" aria-label="Подключение">
        <span id="connectLabel">Зажмите, чтобы подключиться</span>
      </button>
      <div class="hint">Удерживайте кнопку около полсекунды</div>
    </div>

    <nav class="dock" id="dock" aria-label="Разделы">
      <span class="dock-mark" id="dockMark" aria-hidden="true"></span>
      <button class="tab" type="button" data-tab="servers" aria-label="Серверы и подписки">
        <svg viewBox="0 0 24 24"><rect x="4.6" y="4.6" width="14.8" height="14.8" rx="2.6"/><path d="M4.6 9.6h14.8"/><path d="M9.2 14.4h5.6"/></svg>
        <span class="label">Серверы и подписки</span>
      </button>
      <button class="tab" type="button" data-tab="stats" aria-label="Статистика">
        <svg viewBox="0 0 24 24"><path d="M4.8 19.2h14.4"/><path d="M8 19.2v-5.4"/><path d="M12 19.2V8.6"/><path d="M16 19.2v-8.2"/></svg>
        <span class="label">Статистика</span>
      </button>
      <button class="tab" type="button" data-tab="settings" aria-label="Настройки">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 12l3.3-2.2"/><circle cx="12" cy="12" r="1.15" fill="currentColor" stroke="none"/></svg>
        <span class="label">Настройки</span>
      </button>
    </nav>

    <div class="toast" id="toast"></div>
  </section>

  <aside class="panel" id="panel" aria-live="polite">
    <div class="panel-inner" id="panelInner">
      <header class="panel-head">
        <h2 id="panelTitle"></h2>
        <button class="icon-btn" id="panelClose" aria-label="Закрыть">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div class="panel-body" id="panelBody"></div>
    </div>
  </aside>

</div>

<script>
(() => {
  'use strict';

  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };

  // ---------- данные (условные) ----------
  const MB = 1024 * 1024, GB = 1024 * MB, DAY = 86400000;
  const ORIGIN = { name: 'Хельсинки', lat: 60.17, lng: 24.94 };
  const GROUPS = [
    { id: 'free', name: 'Бесплатные сервера', open: true,
      desc: 'Публичная подписка. Список обновляется автоматически каждый день.',
      traffic: { used: 3 * GB, total: 10 * GB, expire: Date.now() + 30 * DAY } },
    { id: 'own', name: 'Личная подписка', open: false,
      desc: 'Серверы, которые вы добавили вручную.',
      traffic: { used: 0.8 * GB, total: null, expire: null } }
  ];
  const SERVERS = [
    { id: 'de1', group: 'free', name: 'Berlin',    country: 'Германия', flag: '🇩🇪', lat: 52.52, lng: 13.40,  proto: 'VLESS' },
    { id: 'de2', group: 'free', name: 'Berlin 2',  country: 'Германия', flag: '🇩🇪', lat: 52.52, lng: 13.40,  proto: 'VLESS' },
    { id: 'pl1', group: 'free', name: 'Warsaw',    country: 'Польша',   flag: '🇵🇱', lat: 52.23, lng: 21.01,  proto: 'VLESS' },
    { id: 'fr1', group: 'free', name: 'Paris',     country: 'Франция',  flag: '🇫🇷', lat: 48.85, lng: 2.35,   proto: 'TROJAN' },
    { id: 'sg1', group: 'free', name: 'Singapore', country: 'Сингапур', flag: '🇸🇬', lat: 1.35,  lng: 103.82, proto: 'VLESS' },
    { id: 'jp1', group: 'own',  name: 'Tokyo',     country: 'Япония',   flag: '🇯🇵', lat: 35.68, lng: 139.69, proto: 'VMESS' },
    { id: 'us1', group: 'own',  name: 'New York',  country: 'США',      flag: '🇺🇸', lat: 40.71, lng: -74.0,  proto: 'SS' }
  ];

  // ---------- состояние ----------
  const state = {
    selected: 'de1',
    connected: false,
    ping: {},
    closed: {},
    query: '',
    tab: null,
    setClosed: { display: false, map: false, net: true },
    mapLimit: 200,       // 0 — «Все»
    dupes: 'keep',       // keep | remove
    hidden: new Set()    // серверы, скрытые на карте настройками
  };
  GROUPS.forEach(g => { state.closed[g.id] = !g.open; });

  // ---------- геометрия ----------
  const D2R = Math.PI / 180;
  function unit(lat, lng) {
    const la = lat * D2R, lo = lng * D2R;
    return [Math.cos(la) * Math.sin(lo), Math.sin(la), Math.cos(la) * Math.cos(lo)];
  }
  const byId = id => SERVERS.find(s => s.id === id);
  const ORIGIN_V = unit(ORIGIN.lat, ORIGIN.lng);
  const DOTS = [];
  {
    const N = 1500, golden = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < N; i++) {
      const y = 1 - (2 * (i + 0.5)) / N;
      const r = Math.sqrt(1 - y * y);
      const t = golden * i;
      DOTS.push([Math.cos(t) * r, y, Math.sin(t) * r]);
    }
  }

  // ---------- холст ----------
  const mapWrap = $('#mapWrap');
  const canvas = $('#map');
  const ctx = canvas.getContext('2d');
  const view = { W: 0, H: 0, DPR: 1, R: 200, CX: 0, CY: 0 };
  const col = {};

  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    ['ink', 'paper', 'accent', 'muted', 'line'].forEach(k => { col[k] = cs.getPropertyValue('--' + k).trim(); });
  }
  function resize() {
    const r = canvas.getBoundingClientRect();
    view.W = r.width; view.H = r.height;
    view.DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.round(view.W * view.DPR));
    canvas.height = Math.max(1, Math.round(view.H * view.DPR));
    ctx.setTransform(view.DPR, 0, 0, view.DPR, 0, 0);
    view.R = Math.min(view.W * 0.42, view.H * 0.34);
    view.CX = view.W / 2;
    view.CY = view.H / 2 - 40;
  }

  const rot = { y: 0, x: 0.25 };
  function rotate(v) {
    const cy = Math.cos(rot.y), sy = Math.sin(rot.y), cx = Math.cos(rot.x), sx = Math.sin(rot.x);
    const x1 = v[0] * cy + v[2] * sy;
    const z1 = -v[0] * sy + v[2] * cy;
    const y2 = v[1] * cx - z1 * sx;
    const z2 = v[1] * sx + z1 * cx;
    return [x1, y2, z2];
  }
  function project(v) {
    const r = rotate(v);
    const p = 4.2 / (4.2 - r[2]);
    return { x: view.CX + r[0] * p * view.R, y: view.CY - r[1] * p * view.R, z: r[2] };
  }

  function arcPoints(a, b) {
    const N = 90;
    const dot = Math.max(-1, Math.min(1, a[0] * b[0] + a[1] * b[1] + a[2] * b[2]));
    const ang = Math.acos(dot);
    const s = Math.sin(ang) || 1e-6;
    const out = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const k1 = Math.sin((1 - t) * ang) / s, k2 = Math.sin(t * ang) / s;
      const lift = 1 + (0.06 + 0.24 * ang / Math.PI) * Math.sin(Math.PI * t);
      out.push([(a[0] * k1 + b[0] * k2) * lift, (a[1] * k1 + b[1] * k2) * lift, (a[2] * k1 + b[2] * k2) * lift]);
    }
    return out;
  }
  let arc = null;
  let arcGrow = 1, arcGrowStart = 0;

  function buildArc() {
    const s = byId(state.selected);
    arc = arcPoints(ORIGIN_V, unit(s.lat, s.lng));
  }

  let target = null;
  function aimAt(v) {
    const r = Math.hypot(v[0], v[2]) || 1e-6;
    target = { y: -Math.atan2(v[0], v[2]), x: Math.max(-0.55, Math.min(0.75, Math.atan2(v[1], r))) };
  }
  function aimMiddle() {
    const s = byId(state.selected);
    const b = unit(s.lat, s.lng);
    const m = [ORIGIN_V[0] + b[0], ORIGIN_V[1] + b[1], ORIGIN_V[2] + b[2]];
    const l = Math.hypot(m[0], m[1], m[2]) || 1;
    aimAt([m[0] / l, m[1] / l, m[2] / l]);
  }

  // ---------- отрисовка глобуса ----------
  function drawDots() {
    ctx.fillStyle = col.ink;
    for (const v of DOTS) {
      const r = rotate(v);
      if (r[2] < -0.04) continue;
      const p = 4.2 / (4.2 - r[2]);
      const x = view.CX + r[0] * p * view.R, y = view.CY - r[1] * p * view.R;
      ctx.globalAlpha = 0.1 + 0.85 * Math.pow(Math.max(0, r[2]), 0.9);
      ctx.fillRect(x - 0.8, y - 0.8, 1.6, 1.6);
    }
    ctx.globalAlpha = 1;
  }
  function strokeRun(run, width, color, alpha) {
    if (run.length < 2) return;
    ctx.beginPath();
    run.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
    ctx.lineWidth = width; ctx.strokeStyle = color; ctx.globalAlpha = alpha;
    ctx.stroke();
  }
  function drawArc(now) {
    if (!arc || !state.connected) return;
    const n = arc.length;
    const k = Math.floor(arcGrow * (n - 1));
    const runs = [];
    let run = [];
    for (let i = 0; i <= k; i++) {
      const p = project(arc[i]);
      if (p.z > 0.02) run.push(p);
      else { if (run.length > 1) runs.push(run); run = []; }
    }
    if (run.length > 1) runs.push(run);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    runs.forEach(r => strokeRun(r, 4.4, col.paper, 0.9));
    runs.forEach(r => strokeRun(r, 1.8, col.accent, 1));

    if (arcGrow > 0.98) {
      const head = ((now % 3400) / 3400) * (n - 1);
      let prev = null;
      const TAIL = 12;
      for (let st = TAIL; st >= 0; st--) {
        const f = head - st * 0.7;
        if (f < 0) { prev = null; continue; }
        const j = Math.floor(f), jj = Math.min(n - 1, j + 1), kk = f - j;
        const A = arc[j], B = arc[jj];
        const q = project([A[0] + (B[0] - A[0]) * kk, A[1] + (B[1] - A[1]) * kk, A[2] + (B[2] - A[2]) * kk]);
        if (prev && prev.z > 0.02 && q.z > 0.02) {
          const fade = 1 - st / TAIL;
          ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(q.x, q.y);
          ctx.strokeStyle = col.accent; ctx.lineWidth = 1.2 + 1.2 * fade; ctx.globalAlpha = 0.12 + 0.8 * fade;
          ctx.stroke();
        }
        prev = q;
      }
      ctx.globalAlpha = 1;
    }
  }
  function drawOrigin(now) {
    const p = project(ORIGIN_V);
    if (p.z <= 0.02) return;
    const k = (now % 2600) / 2600;
    ctx.beginPath(); ctx.arc(p.x, p.y, 6 + 14 * k, 0, Math.PI * 2);
    ctx.strokeStyle = col.accent; ctx.lineWidth = 1.2; ctx.globalAlpha = 0.5 * (1 - k); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = col.accent; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = col.paper; ctx.stroke();
  }
  const EMOJI_FONT = '"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
  function drawServers() {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const s of SERVERS) {
      const p = project(unit(s.lat, s.lng));
      s._p = p;
      if (p.z <= 0.02) continue;
      const sel = s.id === state.selected;
      if (!sel && state.hidden.has(s.id)) continue;
      const r = sel ? 16 : 12;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = col.paper; ctx.fill();
      ctx.lineWidth = sel ? 2 : 1; ctx.strokeStyle = sel ? col.accent : col.line; ctx.stroke();
      ctx.font = '14px ' + EMOJI_FONT;
      ctx.fillText(s.flag, p.x, p.y + 0.5);
      if (sel) {
        ctx.font = '600 12px system-ui, sans-serif';
        ctx.fillStyle = col.ink;
        ctx.fillText(s.name, p.x, p.y + r + 14);
      }
    }
  }

  // ---------- цикл кадра ----------
  let lastT = performance.now();
  let dragging = false, dragMoved = 0, lastPt = null;
  function frame(now) {
    const dt = Math.min(50, now - lastT); lastT = now;
    if (!dragging) {
      if (target) {
        let dy = target.y - rot.y;
        dy = Math.atan2(Math.sin(dy), Math.cos(dy));
        rot.y += dy * 0.09;
        rot.x += (target.x - rot.x) * 0.09;
        if (Math.abs(dy) < 0.002 && Math.abs(target.x - rot.x) < 0.002) target = null;
      } else if (!state.connected) {
        rot.y += 0.0022 * dt / 16.67;
      }
    }
    if (arcGrowStart && arcGrow < 1) {
      const k = Math.min(1, (now - arcGrowStart) / 900);
      arcGrow = 1 - Math.pow(1 - k, 3);
    }
    ctx.clearRect(0, 0, view.W, view.H);
    drawDots();
    drawArc(now);
    drawOrigin(now);
    drawServers();
    requestAnimationFrame(frame);
  }

  // ---------- взаимодействие с картой ----------
  canvas.addEventListener('pointerdown', e => {
    dragging = true; dragMoved = 0; lastPt = { x: e.clientX, y: e.clientY };
    target = null; canvas.classList.add('is-drag'); canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastPt.x, dy = e.clientY - lastPt.y;
    dragMoved += Math.abs(dx) + Math.abs(dy);
    rot.y += dx * 0.006;
    rot.x = Math.max(-0.9, Math.min(0.9, rot.x + dy * 0.006));
    lastPt = { x: e.clientX, y: e.clientY };
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false; canvas.classList.remove('is-drag');
    if (dragMoved < 5) {
      const rc = canvas.getBoundingClientRect();
      const x = e.clientX - rc.left, y = e.clientY - rc.top;
      let hit = null, best = 18;
      for (const s of SERVERS) {
        if (!s._p || s._p.z <= 0.02 || state.hidden.has(s.id)) continue;
        const d = Math.hypot(s._p.x - x, s._p.y - y);
        if (d < best) { best = d; hit = s; }
      }
      if (hit) select(hit.id);
    }
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // ---------- статус, выбор, подключение ----------
  const statusEl = $('#status');
  const connectBtn = $('#connect');
  const connectLabel = $('#connectLabel');
  const toastEl = $('#toast');
  let toastTimer = 0;

  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  function renderStatus() {
    const s = byId(state.selected);
    statusEl.classList.toggle('on', state.connected);
    statusEl.querySelector('span').textContent = state.connected ? 'Подключено · ' + s.name : 'Не подключено';
    connectBtn.classList.toggle('on', state.connected);
    connectLabel.textContent = state.connected ? 'Отключиться' : 'Зажмите, чтобы подключиться';
    document.querySelectorAll('[data-id].card, [data-id].row').forEach(c => c.classList.toggle('is-sel', c.dataset.id === state.selected));
  }

  function select(id) {
    if (!byId(id)) return;
    const changed = id !== state.selected;
    state.selected = id;
    buildArc();
    aimMiddle();
    computeHidden();
    if (state.connected && changed) {
      arcGrow = 0; arcGrowStart = performance.now();
      toast('Сервер переключён: ' + byId(id).name);
    }
    renderStatus();
  }

  function toggleConnection() {
    state.connected = !state.connected;
    if (state.connected) {
      buildArc(); aimMiddle();
      arcGrow = 0; arcGrowStart = performance.now();
      toast('Подключено');
    } else {
      arcGrowStart = 0; arcGrow = 1;
      toast('Отключено');
    }
    renderStatus();
  }

  const HOLD_MS = 500;
  let holding = false, holdStart = 0, holdRaf = 0;
  function holdTick(now) {
    if (!holding) return;
    const k = Math.min(1, (now - holdStart) / HOLD_MS);
    connectBtn.style.setProperty('--p', k.toFixed(3));
    if (k >= 1) {
      holding = false;
      connectBtn.style.setProperty('--p', 0);
      toggleConnection();
      return;
    }
    holdRaf = requestAnimationFrame(holdTick);
  }
  connectBtn.addEventListener('pointerdown', e => {
    if (holding) return;
    holding = true; holdStart = performance.now();
    connectBtn.setPointerCapture(e.pointerId);
    holdRaf = requestAnimationFrame(holdTick);
  });
  function holdCancel() {
    if (!holding) return;
    holding = false;
    cancelAnimationFrame(holdRaf);
    connectBtn.style.setProperty('--p', 0);
    toast('Зажмите кнопку, чтобы ' + (state.connected ? 'отключиться' : 'подключиться'));
  }
  connectBtn.addEventListener('pointerup', holdCancel);
  connectBtn.addEventListener('pointercancel', holdCancel);

  // ---------- пинг и фильтры карты ----------
  function pingClass(ms) {
    if (typeof ms !== 'number') return '';
    return ms < 100 ? 'good' : ms < 200 ? 'mid' : 'bad';
  }
  function pingText(v) {
    if (v === 'busy') return '…';
    if (v === 'none' || v == null) return '— мс';
    return v + ' мс';
  }
  function setPing(id, v) {
    state.ping[id] = v;
    document.querySelectorAll('[data-ping="' + id + '"]').forEach(node => {
      node.textContent = pingText(v);
      node.className = 'ping ' + pingClass(v);
    });
    computeHidden();
  }
  function pingGroup(gid) {
    SERVERS.filter(s => s.group === gid).forEach(s => {
      setPing(s.id, 'busy');
      setTimeout(() => {
        const ms = Math.round(25 + Math.random() * 230);
        setPing(s.id, ms > 260 ? 'none' : ms);
      }, 300 + Math.random() * 900);
    });
  }
  function rank(s) {
    const v = state.ping[s.id];
    return typeof v === 'number' ? v : Infinity;
  }
  // порог пинга и дубликаты — как в настройках приложения
  function computeHidden() {
    const hidden = new Set();
    const limit = state.mapLimit;
    SERVERS.forEach(s => {
      if (!limit || s.id === state.selected) return;
      const v = state.ping[s.id];
      if (v === 'none' || (typeof v === 'number' && v > limit)) hidden.add(s.id);
    });
    if (state.dupes === 'remove') {
      const places = {};
      SERVERS.forEach(s => {
        if (hidden.has(s.id)) return;
        const key = s.lat + ',' + s.lng;
        (places[key] = places[key] || []).push(s);
      });
      Object.keys(places).forEach(key => {
        const group = places[key].slice().sort((a, b) => rank(a) - rank(b));
        group.slice(1).forEach(s => { if (s.id !== state.selected) hidden.add(s.id); });
      });
    }
    state.hidden = hidden;
  }

  // ---------- панель: категории ----------
  const panel = $('#panel');
  const panelInner = $('#panelInner');
  const panelBody = $('#panelBody');
  const panelTitle = $('#panelTitle');
  const dock = $('#dock');
  const dockMark = $('#dockMark');
  const TABS = {
    servers: 'Серверы и подписки',
    stats: 'Статистика',
    settings: 'Настройки'
  };
  let swapTimer = 0;

  function moveMark() {
    const btn = dock.querySelector('.tab.is-active');
    if (!btn) { dock.classList.remove('has-active'); return; }
    dock.classList.add('has-active');
    dockMark.style.left = btn.offsetLeft + 'px';
    dockMark.style.width = btn.offsetWidth + 'px';
  }

  function openTab(tab) {
    if (state.tab === tab) { closePanel(); return; }
    const wasOpen = state.tab !== null;
    state.tab = tab;
    dock.querySelectorAll('.tab').forEach(b => b.classList.toggle('is-active', b.dataset.tab === tab));
    moveMark();
    panelTitle.textContent = TABS[tab];
    clearTimeout(swapTimer);
    if (wasOpen) {
      panelInner.classList.add('is-swap');
      swapTimer = setTimeout(() => {
        if (state.tab !== tab) return;
        renderTab(tab);
        panelInner.classList.remove('is-swap');
      }, 170);
    } else {
      renderTab(tab);
      panel.classList.add('is-open');
    }
    requestAnimationFrame(() => {});
  }

  function closePanel() {
    state.tab = null;
    panel.classList.remove('is-open');
    dock.querySelectorAll('.tab').forEach(b => b.classList.remove('is-active'));
    moveMark();
  }

  function renderTab(tab) {
    panelBody.textContent = '';
    if (tab === 'servers') panelBody.appendChild(buildServersPanel());
    if (tab === 'stats') panelBody.appendChild(buildStatsPanel());
    if (tab === 'settings') panelBody.appendChild(buildSettingsPanel());
  }

  // превью-карточка: мини-карта с дугой от Хельсинки
  const THUMB_W = 160, THUMB_H = 96;
  function thumbXY(lat, lng) {
    return { x: (lng + 180) / 360 * THUMB_W, y: (90 - lat) / 180 * THUMB_H };
  }
  function thumbNode(s) {
    const o = thumbXY(ORIGIN.lat, ORIGIN.lng);
    const d = thumbXY(s.lat, s.lng);
    const mx = (o.x + d.x) / 2;
    const my = Math.min(o.y, d.y) - Math.max(10, Math.hypot(d.x - o.x, d.y - o.y) * 0.45);
    const wrap = el('div', 'thumb');
    wrap.innerHTML = `<svg viewBox="0 0 ${THUMB_W} ${THUMB_H}" preserveAspectRatio="none" aria-hidden="true">
        <path class="arc" pathLength="200" d="M${o.x.toFixed(1)} ${o.y.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${d.x.toFixed(1)} ${d.y.toFixed(1)}"/>
      </svg>`;
    const pinO = el('span', 'pin o');
    pinO.style.left = (o.x / THUMB_W * 100) + '%'; pinO.style.top = (o.y / THUMB_H * 100) + '%';
    const pinS = el('span', 'pin s');
    pinS.style.left = (d.x / THUMB_W * 100) + '%'; pinS.style.top = (d.y / THUMB_H * 100) + '%';
    wrap.append(pinO, pinS);
    return wrap;
  }
  function cardNode(s) {
    const btn = el('button', 'card');
    btn.type = 'button';
    btn.dataset.id = s.id;
    if (s.id === state.selected) btn.classList.add('is-sel');
    if (state.hidden.has(s.id)) btn.classList.add('is-hidden');
    btn.appendChild(thumbNode(s));
    const body = el('div', 'card-body');
    const top = el('div', 'card-top');
    top.appendChild(el('span', 'flag', s.flag));
    const ping = el('span', 'ping', pingText(state.ping[s.id]));
    ping.dataset.ping = s.id;
    ping.className = 'ping ' + pingClass(state.ping[s.id]);
    top.appendChild(ping);
    body.appendChild(top);
    body.appendChild(el('div', 'name', s.name));
    body.appendChild(el('div', 'sub', s.country + ' · ' + s.proto));
    btn.appendChild(body);
    btn.addEventListener('click', () => select(s.id));
    return btn;
  }

  let groupsHost = null;
  function buildGroup(g) {
    const items = SERVERS.filter(s => s.group === g.id)
      .filter(s => !state.query || (s.name + ' ' + s.country).toLowerCase().includes(state.query));
    if (state.query && !items.length) return null;

    const t = g.traffic;
    const ratio = t.total ? Math.min(1, t.used / t.total) : 0;
    const days = t.expire ? Math.max(0, Math.ceil((t.expire - Date.now()) / DAY)) : null;
    const numbers = fmtBytes(t.used) + '/' + (t.total ? fmtBytes(t.total) : '∞');

    const section = el('section', 'group' + (state.closed[g.id] ? ' is-closed' : ''));
    const head = el('div', 'group-head');
    head.setAttribute('role', 'button');
    head.tabIndex = 0;
    head.appendChild(el('span', 'group-name', g.name));
    head.appendChild(el('span', 'count', String(items.length)));
    head.appendChild(Object.assign(el('span', 'chev'), { innerHTML: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>' }));
    section.appendChild(head);

    const collapse = el('div', 'collapse');
    const inner = el('div');
    if (g.desc) inner.appendChild(el('p', 'group-desc', g.desc));
    const strip = el('div', 'stats');
    strip.appendChild(el('span', '', days == null ? '∞' : days + ' ' + daysWord(days)));
    const bar = el('span', 'bar');
    const fill = el('i');
    fill.style.width = '0%';
    bar.appendChild(fill);
    strip.appendChild(bar);
    strip.appendChild(el('span', '', numbers));
    inner.appendChild(strip);
    const cards = el('div', 'cards');
    items.forEach(s => cards.appendChild(cardNode(s)));
    inner.appendChild(cards);
    const actions = el('div', 'group-actions');
    const pingBtn = el('button', 'ghost', 'Пинг группы');
    pingBtn.type = 'button';
    pingBtn.addEventListener('click', e => { e.stopPropagation(); pingGroup(g.id); });
    const shareBtn = el('button', 'ghost', g.id === 'free' ? 'Обновить' : 'Поделиться');
    shareBtn.type = 'button';
    shareBtn.addEventListener('click', e => { e.stopPropagation(); toast(g.id === 'free' ? 'Подписка обновлена' : 'Ссылка скопирована'); });
    actions.append(pingBtn, shareBtn);
    inner.appendChild(actions);
    collapse.appendChild(inner);
    section.appendChild(collapse);

    const toggle = () => {
      state.closed[g.id] = !state.closed[g.id];
      section.classList.toggle('is-closed', state.closed[g.id]);
    };
    head.addEventListener('click', toggle);
    head.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
    requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.width = (ratio * 100).toFixed(1) + '%'; }));
    return section;
  }
  function renderGroups() {
    if (!groupsHost) return;
    groupsHost.textContent = '';
    GROUPS.forEach(g => {
      const node = buildGroup(g);
      if (node) groupsHost.appendChild(node);
    });
  }
  function buildServersPanel() {
    const root = el('div');
    const search = el('input', 'search');
    search.type = 'search';
    search.placeholder = 'Поиск по странам и городам';
    search.value = state.query;
    search.addEventListener('input', () => { state.query = search.value.trim().toLowerCase(); renderGroups(); });
    root.appendChild(search);
    groupsHost = el('div');
    root.appendChild(groupsHost);
    renderGroups();
    return root;
  }

  function fmtBytes(b) {
    const mb = b / MB;
    const r1 = x => Math.round(x * 10) / 10;
    if (mb < 1024) return (mb < 10 ? r1(mb) : Math.round(mb)) + 'мб';
    const gb = mb / 1024;
    return (gb < 10 ? r1(gb) : Math.round(gb)) + 'гб';
  }
  function daysWord(n) {
    const a = n % 10, b = n % 100;
    if (a === 1 && b !== 11) return 'день';
    if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return 'дня';
    return 'дней';
  }

  function buildStatsPanel() {
    const root = el('div');
    const known = Object.values(state.ping).filter(v => typeof v === 'number');
    const avg = known.length ? Math.round(known.reduce((a, b) => a + b, 0) / known.length) + ' мс' : '— мс';
    const kpis = el('div', 'kpis');
    [['1.2гб', 'сегодня'], [String(SERVERS.length), 'серверов'], [avg, 'средний пинг']].forEach(([v, l]) => {
      const k = el('div', 'kpi');
      k.appendChild(el('b', '', v));
      k.appendChild(el('span', '', l));
      kpis.appendChild(k);
    });
    root.appendChild(kpis);

    const chart = el('div', 'chart');
    chart.appendChild(el('h3', '', 'Трафик за 7 дней, мб'));
    const bars = el('div', 'bars');
    const days = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];
    const values = [420, 980, 640, 1320, 860, 1500, 1200];
    const max = Math.max(...values);
    const fills = [];
    days.forEach((d, i) => {
      const col = el('div');
      const b = el('i');
      b.dataset.h = String(Math.round(values[i] / max * 100));
      fills.push(b);
      col.append(b, el('span', '', d));
      bars.appendChild(col);
    });
    chart.appendChild(bars);
    root.appendChild(chart);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      fills.forEach(b => { b.style.height = b.dataset.h + '%'; });
    }));
    return root;
  }

  function setSegment(group, value, onPick) {
    const seg = el('div', 'segmented');
    seg.setAttribute('role', 'group');
    group.forEach(([v, label]) => {
      const b = el('button', '', label);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(v === value));
      b.addEventListener('click', () => {
        seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        onPick(v);
      });
      seg.appendChild(b);
    });
    return seg;
  }
  function settingsSection(key, title, rows) {
    const sec = el('section', 'set' + (state.setClosed[key] ? ' is-closed' : ''));
    const head = el('button', 'set-head', title);
    head.type = 'button';
    head.appendChild(Object.assign(el('span', 'chev'), { innerHTML: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>' }));
    const body = el('div', 'set-body');
    rows.forEach(r => body.appendChild(r));
    head.addEventListener('click', () => {
      state.setClosed[key] = !state.setClosed[key];
      sec.classList.toggle('is-closed', state.setClosed[key]);
    });
    sec.append(head, body);
    return sec;
  }
  function settingRow(title, hint, control) {
    const row = el('div', 'set-row');
    const text = el('div');
    text.appendChild(document.createTextNode(title));
    if (hint) text.appendChild(el('small', '', hint));
    row.append(text, control);
    return row;
  }
  function buildSettingsPanel() {
    const root = el('div');
    const theme = setSegment([['auto', 'Авто'], ['light', 'Светлая'], ['dark', 'Тёмная']],
      document.documentElement.dataset.theme || 'auto', v => {
        if (v === 'auto') delete document.documentElement.dataset.theme;
        else document.documentElement.dataset.theme = v;
        readColors();
      });
    const limit = setSegment([[0, 'Все'], [200, '200'], [300, '300'], [500, '500'], [1000, '1 с']], state.mapLimit, v => {
      state.mapLimit = v; computeHidden(); renderGroups();
    });
    const dupes = setSegment([['keep', 'Оставлять'], ['remove', 'Убирать']], state.dupes, v => {
      state.dupes = v; computeHidden(); renderGroups();
    });
    const ui = setSegment([[0.9, 'Мельче'], [1, 'Обычный'], [1.12, 'Крупнее']], 1, () => toast('Размер интерфейса — в приложении'));
    root.append(
      settingsSection('display', 'Отображение', [
        settingRow('Тема', 'Авто — как в системе', theme),
        settingRow('Размер интерфейса', null, ui)
      ]),
      settingsSection('map', 'Карта', [
        settingRow('Порог пинга', 'Серверы дольше порога скрываются на карте', limit),
        settingRow('Дубликаты', 'Серверы в одной точке', dupes)
      ]),
      settingsSection('net', 'Сеть', [
        settingRow('Интервал проверки', null, setSegment([['1', '1 мин'], ['5', '5 мин']], '1', () => toast('Интервал сохранён')))
      ])
    );
    return root;
  }

  dock.addEventListener('click', e => {
    const btn = e.target.closest('.tab');
    if (btn) openTab(btn.dataset.tab);
  });
  $('#panelClose').addEventListener('click', closePanel);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.tab) closePanel(); });
  window.addEventListener('resize', () => { moveMark(); });

  // ---------- старт ----------
  new ResizeObserver(() => resize()).observe(mapWrap);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);
  resize();
  readColors();
  rot.y = -Math.atan2(unit(byId('de1').lat, byId('de1').lng)[0], unit(byId('de1').lat, byId('de1').lng)[2]);
  target = null;
  buildArc();
  arcGrow = 1;
  GROUPS.forEach(g => pingGroup(g.id));
  computeHidden();
  renderStatus();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
