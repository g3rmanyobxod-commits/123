<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@smpl2 — desktop preview</title>
<style>
  :root {
    --paper: #f2f1ec;
    --paper-2: #e7e6df;
    --card: #f8f7f3;
    --ink: #17191a;
    --muted: #6f716d;
    --line: rgba(0, 0, 0, .08);
    --accent: #1e6b4d;
    --accent-soft: rgba(30, 107, 77, .12);
    --danger: #b3412e;
    --warn: #9a7a16;
    --r: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #121413;
      --paper-2: #1c1f1d;
      --card: #171a18;
      --ink: #eceee9;
      --muted: #8b8f89;
      --line: rgba(255, 255, 255, .08);
      --accent: #4fbf8c;
      --accent-soft: rgba(79, 191, 140, .14);
      --danger: #e0715b;
      --warn: #d8b24a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--paper);
    color: var(--ink);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  /* ---------- каркас ---------- */
  .app {
    display: grid;
    grid-template-columns: 76px minmax(0, 1fr) 380px;
    height: 100vh;
  }
  .side {
    grid-column: 1; grid-row: 1;
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center;
    gap: 6px; padding: 18px 0;
  }
  .nav {
    width: 46px; height: 46px; border: 0; border-radius: 14px;
    background: transparent; color: var(--muted); cursor: pointer;
    display: grid; place-items: center; transition: background .2s, color .2s;
  }
  .nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .nav:hover { background: var(--paper-2); color: var(--ink); }
  .nav.is-active { background: var(--accent-soft); color: var(--accent); }

  .main { grid-column: 2; grid-row: 1; position: relative; min-width: 0; min-height: 0; overflow: hidden; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #map.is-drag { cursor: grabbing; }

  .brand {
    position: absolute; top: 20px; left: 0; right: 0; text-align: center; pointer-events: none;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; letter-spacing: .34em;
    color: var(--muted); text-transform: lowercase;
  }
  .status {
    position: absolute; top: 14px; right: 18px; display: flex; align-items: center; gap: 8px;
    padding: 7px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line);
    font-size: 13px; color: var(--muted);
  }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status.on { color: var(--ink); }
  .status.on i { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }

  .dock {
    position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .connect {
    position: relative; width: 300px; height: 60px; border: 0; border-radius: 999px;
    background: var(--ink); color: var(--paper); cursor: pointer; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none;
    font-weight: 600; font-size: 15px; letter-spacing: .01em;
    box-shadow: 0 14px 30px -18px rgba(0, 0, 0, .5);
    transition: background .3s ease, transform .15s ease;
  }
  .connect::before {
    content: ""; position: absolute; inset: 0; background: var(--accent);
    transform: scaleX(var(--p, 0)); transform-origin: left center; opacity: .95;
  }
  .connect span { position: relative; }
  .connect:active { transform: scale(.985); }
  .connect.on { background: var(--accent); }
  .connect.on::before { display: none; }
  .hint { font-size: 12px; color: var(--muted); }

  .toast {
    position: absolute; left: 50%; bottom: 112px; transform: translate(-50%, 12px); opacity: 0;
    padding: 9px 16px; border-radius: 999px; background: var(--ink); color: var(--paper);
    font-size: 13px; pointer-events: none; transition: opacity .25s, transform .25s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- панель серверов ---------- */
  .panel {
    grid-column: 3; grid-row: 1;
    border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0;
  }
  .panel-head { padding: 18px 18px 12px; }
  .panel-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .panel-title h2 { margin: 0; font-size: 18px; font-weight: 600; }
  .search {
    width: 100%; height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .list { flex: 1; overflow: auto; padding: 0 12px 20px; }

  .group {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    margin-bottom: 12px; overflow: hidden;
  }
  .group-head {
    display: flex; align-items: center; gap: 8px; padding: 14px 12px 14px 16px; cursor: pointer;
  }
  .group-name { flex: 1; min-width: 0; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .count {
    min-width: 26px; height: 22px; padding: 0 7px; border-radius: 999px; background: var(--paper-2);
    display: inline-grid; place-items: center; font-size: 12px; color: var(--muted);
  }
  .icon-btn {
    width: 32px; height: 32px; border: 0; border-radius: 10px; background: transparent; color: var(--muted);
    display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn:hover { background: var(--paper-2); color: var(--ink); }
  .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .chev { transition: transform .25s ease; }
  .group.is-closed .chev { transform: rotate(-90deg); }
  .group.is-closed .group-body { display: none; }

  .group-desc { margin: 0 16px; padding: 0 0 10px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.5; color: var(--muted); }
  .stats {
    display: flex; align-items: center; gap: 10px; margin: 0 16px; padding: 9px 0 10px;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    font-family: ui-monospace, Menlo, monospace; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .bar { flex: 1; height: 4px; border-radius: 999px; background: var(--paper-2); overflow: hidden; min-width: 40px; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .4s ease; }
  .stats-gap { height: 6px; }

  .row {
    display: flex; align-items: center; gap: 12px; margin: 4px 6px; padding: 9px 10px;
    border-radius: 12px; cursor: pointer; transition: background .2s;
  }
  .row:hover { background: var(--paper-2); }
  .row.is-sel { background: var(--accent-soft); }
  .flag {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper);
    display: grid; place-items: center; font-size: 18px; flex: 0 0 auto;
  }
  .row.is-sel .flag { border: 2px solid var(--accent); }
  .meta { flex: 1; min-width: 0; }
  .meta .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .sub { font-size: 12px; color: var(--muted); }
  .tags { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: 0 0 auto; }
  .chip {
    font-family: ui-monospace, Menlo, monospace; font-size: 11px; padding: 3px 8px; border-radius: 999px;
    background: var(--paper-2); color: var(--muted); white-space: nowrap;
  }
  .ping { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); }
  .ping.good { color: var(--accent); }
  .ping.mid { color: var(--warn); }
  .ping.bad { color: var(--danger); }

  .group-foot { padding: 6px 10px 10px; display: flex; justify-content: flex-end; }
  .ghost {
    height: 32px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: transparent;
    cursor: pointer; font-size: 13px; color: var(--muted);
  }
  .ghost:hover { color: var(--ink); background: var(--paper-2); }

  /* ---------- узкие экраны ---------- */
  @media (max-width: 1100px) {
    .app { grid-template-columns: 76px minmax(0, 1fr) 320px; }
    .connect { width: 260px; }
  }
  @media (max-width: 820px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 42vh 68px; }
    .main { grid-column: 1; grid-row: 1; }
    .panel { grid-column: 1; grid-row: 2; border-left: 0; border-top: 1px solid var(--line); }
    .side { grid-column: 1; grid-row: 3; flex-direction: row; justify-content: center; border-right: 0; border-top: 1px solid var(--line); padding: 8px 0; gap: 10px; }
    .dock { bottom: 16px; }
  }
</style>
</head>
<body>
<div class="app">

  <nav class="side" aria-label="Разделы">
    <button class="nav is-active" aria-label="Главная" title="Главная">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.8 2.6 15.2 0 18M12 3c-2.6 2.8-2.6 15.2 0 18"/></svg>
    </button>
    <button class="nav" aria-label="Серверы" title="Серверы">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="6" rx="2"/><rect x="4" y="14" width="16" height="6" rx="2"/><path d="M8 7h.01M8 17h.01"/></svg>
    </button>
    <button class="nav" aria-label="Подписки" title="Подписки">
      <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6"/></svg>
    </button>
    <button class="nav" aria-label="Статистика" title="Статистика">
      <svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
    </button>
    <button class="nav" aria-label="Настройки" title="Настройки">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </nav>

  <main class="main">
    <canvas id="map" aria-label="Карта серверов"></canvas>
    <p class="brand">@smpl2</p>
    <div class="status" id="status"><i></i><span>Не подключено</span></div>
    <div class="dock">
      <button class="connect" id="connect" aria-label="Подключение">
        <span id="connectLabel">Зажмите, чтобы подключиться</span>
      </button>
      <div class="hint">Удерживайте кнопку около полсекунды</div>
    </div>
    <div class="toast" id="toast"></div>
  </main>

  <aside class="panel">
    <div class="panel-head">
      <div class="panel-title">
        <h2>Серверы</h2>
        <button class="icon-btn" title="Обновить подписки" aria-label="Обновить подписки">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>
        </button>
      </div>
      <input class="search" id="search" type="search" placeholder="Поиск по странам и городам">
    </div>
    <div class="list" id="list"></div>
  </aside>

</div>

<script>
(() => {
  'use strict';

  // ---------- данные (условные) ----------
  const MB = 1024 * 1024, GB = 1024 * MB, DAY = 86400000;
  const ORIGIN = { name: 'Хельсинки', lat: 60.17, lng: 24.94 };
  const GROUPS = [
    { id: 'free', name: 'Бесплатные сервера', open: true,
      desc: 'Публичная подписка. Список обновляется автоматически каждый день.',
      traffic: { used: 3 * GB, total: 10 * GB, expire: Date.now() + 30 * DAY } },
    { id: 'own', name: 'Личная подписка', open: false,
      desc: 'Серверы, которые вы добавили вручную.',
      traffic: { used: 0.8 * GB, total: null, expire: null } }
  ];
  const SERVERS = [
    { id: 'de1', group: 'free', name: 'Berlin',    country: 'Германия', flag: '🇩🇪', lat: 52.52, lng: 13.40,  proto: 'VLESS' },
    { id: 'de2', group: 'free', name: 'Berlin 2',  country: 'Германия', flag: '🇩🇪', lat: 52.52, lng: 13.40,  proto: 'VLESS' },
    { id: 'pl1', group: 'free', name: 'Warsaw',    country: 'Польша',   flag: '🇵🇱', lat: 52.23, lng: 21.01,  proto: 'VLESS' },
    { id: 'fr1', group: 'free', name: 'Paris',     country: 'Франция',  flag: '🇫🇷', lat: 48.85, lng: 2.35,   proto: 'TROJAN' },
    { id: 'sg1', group: 'free', name: 'Singapore', country: 'Сингапур', flag: '🇸🇬', lat: 1.35,  lng: 103.82, proto: 'VLESS' },
    { id: 'jp1', group: 'own',  name: 'Tokyo',     country: 'Япония',   flag: '🇯🇵', lat: 35.68, lng: 139.69, proto: 'VMESS' },
    { id: 'us1', group: 'own',  name: 'New York',  country: 'США',      flag: '🇺🇸', lat: 40.71, lng: -74.0,  proto: 'SS' }
  ];

  // ---------- состояние ----------
  const state = {
    selected: 'de1',
    connected: false,
    ping: {},            // id -> число | 'busy' | 'none'
    closed: {},          // id группы -> свёрнута
    query: ''
  };
  GROUPS.forEach(g => { state.closed[g.id] = !g.open; });

  // ---------- геометрия ----------
  const D2R = Math.PI / 180;
  function unit(lat, lng) {
    const la = lat * D2R, lo = lng * D2R;
    return [Math.cos(la) * Math.sin(lo), Math.sin(la), Math.cos(la) * Math.cos(lo)];
  }
  const byId = id => SERVERS.find(s => s.id === id);
  const ORIGIN_V = unit(ORIGIN.lat, ORIGIN.lng);

  // точки сферы (спираль Фибоначчи)
  const DOTS = [];
  {
    const N = 1500, golden = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < N; i++) {
      const y = 1 - (2 * (i + 0.5)) / N;
      const r = Math.sqrt(1 - y * y);
      const t = golden * i;
      DOTS.push([Math.cos(t) * r, y, Math.sin(t) * r]);
    }
  }

  // ---------- холст ----------
  const canvas = document.getElementById('map');
  const ctx = canvas.getContext('2d');
  const view = { W: 0, H: 0, DPR: 1, R: 200, CX: 0, CY: 0 };
  const col = {};

  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    ['ink', 'paper', 'accent', 'muted', 'line'].forEach(k => { col[k] = cs.getPropertyValue('--' + k).trim(); });
  }
  function resize() {
    const r = canvas.getBoundingClientRect();
    view.W = r.width; view.H = r.height;
    view.DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(view.W * view.DPR);
    canvas.height = Math.round(view.H * view.DPR);
    ctx.setTransform(view.DPR, 0, 0, view.DPR, 0, 0);
    view.R = Math.min(view.W * 0.42, view.H * 0.36);
    view.CX = view.W / 2;
    view.CY = view.H / 2 - 36;
    readColors();
  }

  // вращение: rotY вокруг вертикали, rotX — наклон
  const rot = { y: 0.4, x: 0.25 };
  function rotate(v) {
    const cy = Math.cos(rot.y), sy = Math.sin(rot.y), cx = Math.cos(rot.x), sx = Math.sin(rot.x);
    const x1 = v[0] * cy + v[2] * sy;
    const z1 = -v[0] * sy + v[2] * cy;
    const y2 = v[1] * cx - z1 * sx;
    const z2 = v[1] * sx + z1 * cx;
    return [x1, y2, z2];
  }
  function project(v) {
    const r = rotate(v);
    const p = 4.2 / (4.2 - r[2]);
    return { x: view.CX + r[0] * p * view.R, y: view.CY - r[1] * p * view.R, z: r[2] };
  }

  // дуга: большой круг с подъёмом над сферой
  function arcPoints(a, b) {
    const N = 90;
    const dot = Math.max(-1, Math.min(1, a[0] * b[0] + a[1] * b[1] + a[2] * b[2]));
    const ang = Math.acos(dot);
    const out = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const s = Math.sin(ang) || 1e-6;
      const k1 = Math.sin((1 - t) * ang) / s, k2 = Math.sin(t * ang) / s;
      let p = [a[0] * k1 + b[0] * k2, a[1] * k1 + b[1] * k2, a[2] * k1 + b[2] * k2];
      const lift = 1 + (0.06 + 0.24 * ang / Math.PI) * Math.sin(Math.PI * t);
      out.push([p[0] * lift, p[1] * lift, p[2] * lift]);
    }
    return out;
  }
  let arc = null;             // { pts, start, dur, progress }
  let arcGrow = 1;            // 0..1 — рост дуги
  let arcGrowStart = 0;

  function buildArc() {
    const s = byId(state.selected);
    arc = arcPoints(ORIGIN_V, unit(s.lat, s.lng));
  }

  // ---------- цели вращения: сервер/середина дуги в центре ----------
  let target = null;
  function aimAt(v) {
    const r = Math.hypot(v[0], v[2]) || 1e-6;
    target = { y: -Math.atan2(v[0], v[2]), x: Math.max(-0.55, Math.min(0.75, Math.atan2(v[1], r))) };
  }
  function aimMiddle() {
    const s = byId(state.selected);
    const b = unit(s.lat, s.lng);
    const m = [ORIGIN_V[0] + b[0], ORIGIN_V[1] + b[1], ORIGIN_V[2] + b[2]];
    const l = Math.hypot(m[0], m[1], m[2]) || 1;
    aimAt([m[0] / l, m[1] / l, m[2] / l]);
  }

  // ---------- отрисовка ----------
  function drawDots() {
    ctx.fillStyle = col.ink;
    for (const v of DOTS) {
      const r = rotate(v);
      if (r[2] < -0.04) continue;
      const p = 4.2 / (4.2 - r[2]);
      const x = view.CX + r[0] * p * view.R, y = view.CY - r[1] * p * view.R;
      ctx.globalAlpha = 0.1 + 0.85 * Math.pow(Math.max(0, r[2]), 0.9);
      ctx.fillRect(x - 0.8, y - 0.8, 1.6, 1.6);
    }
    ctx.globalAlpha = 1;
  }

  function strokeRun(run, width, color, alpha) {
    if (run.length < 2) return;
    ctx.beginPath();
    run.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
    ctx.lineWidth = width; ctx.strokeStyle = color; ctx.globalAlpha = alpha;
    ctx.stroke();
  }

  function drawArc(now) {
    if (!arc || !state.connected) return;
    const n = arc.length;
    const k = Math.floor(arcGrow * (n - 1));
    const runs = [];
    let run = [];
    const proj = [];
    for (let i = 0; i <= k; i++) {
      const p = project(arc[i]);
      proj.push(p);
      if (p.z > 0.02) run.push(p);
      else { if (run.length > 1) runs.push(run); run = []; }
    }
    if (run.length > 1) runs.push(run);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    runs.forEach(r => strokeRun(r, 4.4, col.paper, 0.9));
    runs.forEach(r => strokeRun(r, 1.8, col.accent, 1));

    // хвост, бегущий по дуге, — когда дуга выросла
    if (arcGrow > 0.98) {
      const head = ((now % 3400) / 3400) * (n - 1);
      let prev = null;
      const TAIL = 12;
      for (let st = TAIL; st >= 0; st--) {
        const f = head - st * 0.7;
        if (f < 0) { prev = null; continue; }
        const j = Math.floor(f), jj = Math.min(n - 1, j + 1), kk = f - j;
        const A = arc[j], B = arc[jj];
        const q = project([A[0] + (B[0] - A[0]) * kk, A[1] + (B[1] - A[1]) * kk, A[2] + (B[2] - A[2]) * kk]);
        if (prev && prev.z > 0.02 && q.z > 0.02) {
          const fade = 1 - st / TAIL;
          ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(q.x, q.y);
          ctx.strokeStyle = col.accent; ctx.lineWidth = 1.2 + 1.2 * fade; ctx.globalAlpha = 0.12 + 0.8 * fade;
          ctx.stroke();
        }
        prev = q;
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawOrigin(now) {
    const p = project(ORIGIN_V);
    if (p.z <= 0.02) return;
    const k = (now % 2600) / 2600;
    ctx.beginPath(); ctx.arc(p.x, p.y, 6 + 14 * k, 0, Math.PI * 2);
    ctx.strokeStyle = col.accent; ctx.lineWidth = 1.2; ctx.globalAlpha = 0.5 * (1 - k); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = col.accent; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = col.paper; ctx.stroke();
  }

  function drawServers() {
    ctx.font = '14px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const s of SERVERS) {
      const p = project(unit(s.lat, s.lng));
      s._p = p;
      if (p.z <= 0.02) continue;
      const sel = s.id === state.selected;
      const r = sel ? 16 : 12;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = col.paper; ctx.fill();
      ctx.lineWidth = sel ? 2 : 1; ctx.strokeStyle = sel ? col.accent : col.line; ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillText(s.flag, p.x, p.y + 0.5);
      if (sel) {
        ctx.font = '600 12px system-ui, sans-serif';
        ctx.fillStyle = col.ink;
        ctx.fillText(s.name, p.x, p.y + r + 14);
        ctx.font = '14px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
      }
    }
  }

  // ---------- цикл кадра ----------
  let lastT = performance.now();
  let dragging = false, dragMoved = 0, lastPt = null;
  function frame(now) {
    const dt = Math.min(50, now - lastT); lastT = now;

    if (!dragging) {
      if (target) {
        let dy = target.y - rot.y;
        dy = Math.atan2(Math.sin(dy), Math.cos(dy));
        rot.y += dy * 0.09;
        rot.x += (target.x - rot.x) * 0.09;
        if (Math.abs(dy) < 0.002 && Math.abs(target.x - rot.x) < 0.002) target = null;
      } else if (!state.connected) {
        rot.y += 0.0022 * dt / 16.67;
      }
    }
    if (arcGrowStart && arcGrow < 1) {
      arcGrow = Math.min(1, (now - arcGrowStart) / 900);
      arcGrow = 1 - Math.pow(1 - arcGrow, 3);
    }

    ctx.clearRect(0, 0, view.W, view.H);
    drawDots();
    drawArc(now);
    drawOrigin(now);
    drawServers();
    requestAnimationFrame(frame);
  }

  // ---------- взаимодействие с глобусом ----------
  canvas.addEventListener('pointerdown', e => {
    dragging = true; dragMoved = 0; lastPt = { x: e.clientX, y: e.clientY };
    target = null; canvas.classList.add('is-drag'); canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastPt.x, dy = e.clientY - lastPt.y;
    dragMoved += Math.abs(dx) + Math.abs(dy);
    rot.y += dx * 0.006;
    rot.x = Math.max(-0.9, Math.min(0.9, rot.x + dy * 0.006));
    lastPt = { x: e.clientX, y: e.clientY };
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false; canvas.classList.remove('is-drag');
    if (dragMoved < 5) {
      const rc = canvas.getBoundingClientRect();
      const x = e.clientX - rc.left, y = e.clientY - rc.top;
      let hit = null, best = 18;
      for (const s of SERVERS) {
        if (!s._p || s._p.z <= 0.02) continue;
        const d = Math.hypot(s._p.x - x, s._p.y - y);
        if (d < best) { best = d; hit = s; }
      }
      if (hit) select(hit.id);
    }
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // ---------- выбор и подключение ----------
  const statusEl = document.getElementById('status');
  const connectBtn = document.getElementById('connect');
  const connectLabel = document.getElementById('connectLabel');
  const toastEl = document.getElementById('toast');
  let toastTimer = 0;

  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  function renderStatus() {
    const s = byId(state.selected);
    statusEl.classList.toggle('on', state.connected);
    statusEl.querySelector('span').textContent = state.connected
      ? 'Подключено · ' + s.name
      : 'Не подключено';
    connectBtn.classList.toggle('on', state.connected);
    connectLabel.textContent = state.connected ? 'Отключиться' : 'Зажмите, чтобы подключиться';
    document.querySelectorAll('.row').forEach(r => r.classList.toggle('is-sel', r.dataset.id === state.selected));
  }

  function select(id) {
    if (!byId(id)) return;
    const changed = id !== state.selected;
    state.selected = id;
    buildArc();
    aimMiddle();
    if (state.connected && changed) {
      arcGrow = 0; arcGrowStart = performance.now();
      toast('Сервер переключён: ' + byId(id).name);
    }
    renderStatus();
  }

  function toggleConnection() {
    state.connected = !state.connected;
    if (state.connected) {
      buildArc();
      aimMiddle();
      arcGrow = 0; arcGrowStart = performance.now();
      toast('Подключено');
    } else {
      arcGrow = 0; arcGrowStart = 0;
      toast('Отключено');
    }
    renderStatus();
  }

  // удержание 0,5 с
  const HOLD_MS = 500;
  let holding = false, holdStart = 0, holdRaf = 0;
  function holdTick(now) {
    if (!holding) return;
    const k = Math.min(1, (now - holdStart) / HOLD_MS);
    connectBtn.style.setProperty('--p', k.toFixed(3));
    if (k >= 1) {
      holding = false;
      connectBtn.style.setProperty('--p', 0);
      toggleConnection();
      return;
    }
    holdRaf = requestAnimationFrame(holdTick);
  }
  connectBtn.addEventListener('pointerdown', e => {
    if (holding) return;
    holding = true; holdStart = performance.now();
    connectBtn.setPointerCapture(e.pointerId);
    holdRaf = requestAnimationFrame(holdTick);
  });
  function holdCancel() {
    if (!holding) return;
    holding = false;
    cancelAnimationFrame(holdRaf);
    connectBtn.style.setProperty('--p', 0);
    toast('Зажмите кнопку, чтобы ' + (state.connected ? 'отключиться' : 'подключиться'));
  }
  connectBtn.addEventListener('pointerup', holdCancel);
  connectBtn.addEventListener('pointercancel', holdCancel);

  // ---------- список серверов ----------
  const listEl = document.getElementById('list');
  const searchEl = document.getElementById('search');

  function fmtBytes(b) {
    const mb = b / MB;
    const r1 = x => Math.round(x * 10) / 10;
    if (mb < 1024) return (mb < 10 ? r1(mb) : Math.round(mb)) + 'мб';
    const gb = mb / 1024;
    return (gb < 10 ? r1(gb) : Math.round(gb)) + 'гб';
  }
  function daysWord(n) {
    const a = n % 10, b = n % 100;
    if (a === 1 && b !== 11) return 'день';
    if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return 'дня';
    return 'дней';
  }
  function pingClass(ms) {
    if (typeof ms !== 'number') return '';
    return ms < 100 ? 'good' : ms < 200 ? 'mid' : 'bad';
  }
  function pingText(v) {
    if (v === 'busy') return '…';
    if (v === 'none' || v == null) return '— мс';
    return v + ' мс';
  }

  function buildGroup(g) {
    const items = SERVERS.filter(s => s.group === g.id)
      .filter(s => !state.query || (s.name + ' ' + s.country).toLowerCase().includes(state.query));
    if (state.query && !items.length) return null;

    const t = g.traffic;
    const ratio = t.total ? Math.min(1, t.used / t.total) : 0;
    const days = t.expire ? Math.max(0, Math.ceil((t.expire - Date.now()) / DAY)) : null;
    const numbers = fmtBytes(t.used) + '/' + (t.total ? fmtBytes(t.total) : '∞');

    const wrap = document.createElement('section');
    wrap.className = 'group' + (state.closed[g.id] ? ' is-closed' : '');
    wrap.innerHTML = `
      <div class="group-head" role="button" tabindex="0" aria-expanded="${!state.closed[g.id]}">
        <span class="group-name"></span>
        <span class="count">${items.length}</span>
        <button class="icon-btn" data-act="ping" title="Пинг группы" aria-label="Пинг группы">
          <svg viewBox="0 0 24 24"><path d="M13 3 4 14h7l-1 7 9-11h-7z"/></svg>
        </button>
        <span class="icon-btn chev" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        </span>
      </div>
      <div class="group-body">
        ${g.desc ? `<p class="group-desc">${g.desc}</p>` : ''}
        <div class="stats">
          <span>${days == null ? '∞' : days + ' ' + daysWord(days)}</span>
          <span class="bar"><i style="width:${(ratio * 100).toFixed(1)}%"></i></span>
          <span>${numbers}</span>
        </div>
        <div class="stats-gap"></div>
        <div class="rows"></div>
      </div>`;
    wrap.querySelector('.group-name').textContent = g.name;

    const rows = wrap.querySelector('.rows');
    items.forEach(s => {
      const row = document.createElement('div');
      row.className = 'row' + (s.id === state.selected ? ' is-sel' : '');
      row.dataset.id = s.id;
      row.innerHTML = `
        <div class="flag">${s.flag}</div>
        <div class="meta">
          <div class="name"></div>
          <div class="sub"></div>
        </div>
        <div class="tags">
          <span class="ping" data-ping="${s.id}"></span>
          <span class="chip">${s.proto}</span>
        </div>`;
      row.querySelector('.name').textContent = s.name;
      row.querySelector('.sub').textContent = s.country;
      const pingEl = row.querySelector('.ping');
      const v = state.ping[s.id];
      pingEl.textContent = pingText(v);
      pingEl.className = 'ping ' + pingClass(v);
      row.addEventListener('click', () => select(s.id));
      rows.appendChild(row);
    });

    const head = wrap.querySelector('.group-head');
    const toggle = () => {
      state.closed[g.id] = !state.closed[g.id];
      wrap.classList.toggle('is-closed', state.closed[g.id]);
      head.setAttribute('aria-expanded', String(!state.closed[g.id]));
    };
    head.addEventListener('click', e => {
      if (e.target.closest('[data-act="ping"]')) return;
      toggle();
    });
    head.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
    wrap.querySelector('[data-act="ping"]').addEventListener('click', () => pingGroup(g.id));
    return wrap;
  }

  function renderList() {
    listEl.textContent = '';
    GROUPS.forEach(g => {
      const node = buildGroup(g);
      if (node) listEl.appendChild(node);
    });
  }

  function setPing(id, v) {
    state.ping[id] = v;
    const el = document.querySelector('[data-ping="' + id + '"]');
    if (el) { el.textContent = pingText(v); el.className = 'ping ' + pingClass(v); }
  }
  function pingGroup(gid) {
    SERVERS.filter(s => s.group === gid).forEach(s => {
      setPing(s.id, 'busy');
      setTimeout(() => {
        const ms = Math.round(25 + Math.random() * 230);
        setPing(s.id, ms > 260 ? 'none' : ms);
      }, 300 + Math.random() * 900);
    });
  }

  searchEl.addEventListener('input', () => {
    state.query = searchEl.value.trim().toLowerCase();
    renderList();
  });

  // навигация: только подсветка (макет)
  document.querySelectorAll('.nav').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav').forEach(b => b.classList.toggle('is-active', b === btn));
    });
  });

  // ---------- старт ----------
  window.addEventListener('resize', resize);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);
  resize();
  buildArc();
  aimMiddle();
  target = null;
  rot.y = -Math.atan2(unit(byId('de1').lat, byId('de1').lng)[0], unit(byId('de1').lat, byId('de1').lng)[2]);
  renderList();
  renderStatus();
  // демонстрационные пинги
  pingGroup('free');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
